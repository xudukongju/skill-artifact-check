name: Tests and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-index --find-links dist skill-artifact-check
      - run: skill-artifact-check examples/demo --source examples/demo --json
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate release version
        run: |
          python -c 'import os,tomllib; from skill_artifact_check import __version__; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v" + v and __version__ == v, "Tag and package versions must agree"'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="skill-artifact-check-${version}/" -o "dist/skill-artifact-check-${version}-source.zip" HEAD
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*-source.zip --verify-tag --prerelease --title "Skill Artifact Check ${version} (alpha)" --notes-file "docs/releases/${version}.md"
